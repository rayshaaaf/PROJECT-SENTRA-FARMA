<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Sentra Farma</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ECFDF5', 100: '#D1FAE5', 200: '#A7F3D0', 300: '#6EE7B7',
                            400: '#34D399', 500: '#10B981', 600: '#059669', 700: '#047857',
                            800: '#065F46', 900: '#064E3B', 950: '#022C22'
                        },
                        surface: '#F8FAFC'
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        .mesh-bg {
            background-color: #F8FAFC;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(5, 150, 105, 0.1) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(16, 185, 129, 0.14) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 78, 59, 0.08) 0px, transparent 50%);
        }
    </style>
</head>
<body class="mesh-bg font-sans text-slate-800 min-h-screen flex items-center justify-center p-4 md:p-8 antialiased relative overflow-hidden selection:bg-brand-100 selection:text-brand-800">
    
    <!-- BACKGROUND ELEGANT AMBIENT GLOW -->
    <div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-brand-400/15 rounded-full blur-[140px] pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-[500px] h-[500px] bg-teal-400/15 rounded-full blur-[140px] pointer-events-none"></div>

    <!-- CENTERED CARD -->
    <div class="max-w-md w-full bg-white/95 backdrop-blur-2xl border border-emerald-100/80 shadow-[0_25px_70px_-15px_rgba(16,185,129,0.15)] p-8 md:p-10 rounded-[2.5rem] relative z-10 space-y-6 transition-all">
        
        <!-- PROMINENT LARGE CENTRED LOGO -->
        <div class="text-center space-y-2">
            <img src="../../assets/logo.png" alt="Sentra Farma Logo" class="h-20 md:h-24 w-auto object-contain mx-auto drop-shadow-md transition-transform hover:scale-105 duration-300" />
            <div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Pembaruan Password</h1>
                <p class="text-xs font-medium text-slate-500 mt-1">Masukkan token dan buat password baru Anda</p>
            </div>
        </div>

        <form id="reset-form" class="space-y-4 text-xs">
            <div>
                <label class="block font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">Token Reset *</label>
                <div class="relative group">
                    <span class="material-symbols-outlined absolute left-4 top-3.5 text-slate-400 group-focus-within:text-brand-600 text-[20px] transition-colors">key</span>
                    <input type="text" id="token" required placeholder="Paste token di sini" class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl py-3 pl-11 pr-4 text-xs font-mono font-medium text-slate-900 placeholder-slate-400 focus:outline-none focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-500/15 transition-all" />
                </div>
            </div>

            <div>
                <label class="block font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">Password Baru * (Min. 8 Karakter)</label>
                <div class="relative group">
                    <span class="material-symbols-outlined absolute left-4 top-3.5 text-slate-400 group-focus-within:text-brand-600 text-[20px] transition-colors">lock</span>
                    <input type="password" id="newPassword" required minlength="8" placeholder="••••••••" class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl py-3 pl-11 pr-11 text-xs font-medium text-slate-900 placeholder-slate-400 focus:outline-none focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-500/15 transition-all" />
                    <button type="button" onclick="togglePasswordVisibility('newPassword', 'eye-icon-new')" class="absolute right-3.5 top-3 text-slate-400 hover:text-slate-700 focus:outline-none p-1 transition-colors" title="Lihat Password">
                        <span id="eye-icon-new" class="material-symbols-outlined text-[20px]">visibility</span>
                    </button>
                </div>
            </div>

            <div>
                <label class="block font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">Konfirmasi Password Baru *</label>
                <div class="relative group">
                    <span class="material-symbols-outlined absolute left-4 top-3.5 text-slate-400 group-focus-within:text-brand-600 text-[20px] transition-colors">lock_reset</span>
                    <input type="password" id="newPasswordConfirmation" required minlength="8" placeholder="••••••••" class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl py-3 pl-11 pr-11 text-xs font-medium text-slate-900 placeholder-slate-400 focus:outline-none focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-500/15 transition-all" />
                    <button type="button" onclick="togglePasswordVisibility('newPasswordConfirmation', 'eye-icon-confirm')" class="absolute right-3.5 top-3 text-slate-400 hover:text-slate-700 focus:outline-none p-1 transition-colors" title="Lihat Konfirmasi Password">
                        <span id="eye-icon-confirm" class="material-symbols-outlined text-[20px]">visibility</span>
                    </button>
                </div>
            </div>

            <button type="submit" id="btn-submit" class="w-full py-4 bg-gradient-to-r from-brand-600 via-brand-700 to-emerald-800 hover:from-brand-500 hover:to-emerald-700 text-white font-extrabold text-xs rounded-2xl shadow-xl shadow-brand-600/25 hover:shadow-brand-600/40 active:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-2 tracking-wide uppercase">
                <span>Perbarui Password</span>
                <span class="material-symbols-outlined text-[18px]">check</span>
            </button>
        </form>

        <div class="text-center text-xs text-slate-500 pt-3 border-t border-slate-100">
            <a href="/frontend/html/auth/login.html" class="text-brand-600 hover:text-brand-700 font-extrabold flex items-center justify-center gap-1">
                <span class="material-symbols-outlined text-[16px]">arrow_back</span> Kembali ke Login
            </a>
        </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/toast.js"></script>
    <script>
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (!input || !icon) return;
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility';
            }
        }


        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const p1 = document.getElementById('newPassword').value;
            const p2 = document.getElementById('newPasswordConfirmation').value;

            if (p1 !== p2) {
                Toast.error('Konfirmasi password baru tidak cocok!', 'Validasi Gagal');
                return;
            }

            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerHTML = `<span class="inline-block animate-spin font-bold">↻</span> <span>Memperbarui...</span>`;

            try {
                const body = {
                    token: document.getElementById('token').value,
                    newPassword: p1,
                    newPasswordConfirmation: p2
                };

                await API.post('/auth/reset-password', body);
                Toast.success('Password berhasil diperbarui! Silakan login dengan password baru.', 'Sukses');
                setTimeout(() => window.location.href = '/frontend/html/auth/login.html', 1500);
            } catch (err) {
                Toast.error(err.message || 'Reset password gagal. Token tidak valid atau kedaluwarsa.', 'Gagal');
                btn.disabled = false;
                btn.innerHTML = `<span>Perbarui Password</span><span class="material-symbols-outlined text-[18px]">check</span>`;
            }
        });
    </script>
</body>
</html>
