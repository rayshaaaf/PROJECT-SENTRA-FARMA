<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Pasien Baru - Sentra Farma</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ECFDF5', 100: '#D1FAE5', 200: '#A7F3D0', 300: '#6EE7B7',
                            400: '#34D399', 500: '#10B981', 600: '#059669', 700: '#047857',
                            800: '#065F46', 900: '#064E3B', 950: '#022C22'
                        },
                        surface: '#F8FAFC'
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        .mesh-bg {
            background-color: #F8FAFC;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(5, 150, 105, 0.1) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(16, 185, 129, 0.14) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 78, 59, 0.08) 0px, transparent 50%);
        }
    </style>
</head>
<body class="mesh-bg font-sans text-slate-800 min-h-screen flex items-center justify-center p-4 md:p-8 antialiased relative overflow-hidden selection:bg-brand-100 selection:text-brand-800">
    
    <!-- BACKGROUND ELEGANT AMBIENT GLOW -->
    <div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-brand-400/15 rounded-full blur-[140px] pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-[500px] h-[500px] bg-teal-400/15 rounded-full blur-[140px] pointer-events-none"></div>

    <!-- CENTERED HERO REGISTER CARD -->
    <div class="max-w-xl w-full bg-white/95 backdrop-blur-2xl border border-emerald-100/80 shadow-[0_25px_70px_-15px_rgba(16,185,129,0.15)] p-8 md:p-10 rounded-[2.5rem] relative z-10 space-y-6 transition-all">
        
        <!-- PROMINENT LARGE CENTRED LOGO -->
        <div class="text-center space-y-2">
            <img src="../../assets/logo.png" alt="Sentra Farma Logo" class="h-20 md:h-24 w-auto object-contain mx-auto drop-shadow-md transition-transform hover:scale-105 duration-300" />
            <div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Pendaftaran Pasien Baru</h1>
                <p class="text-xs font-medium text-slate-500 mt-0.5">Buat akun Pasien Sentra Farma secara online</p>
            </div>
        </div>

        <!-- FORM REGISTER -->
        <form id="register-form" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                <div>
                    <label class="block font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">Nama Lengkap *</label>
                    <div class="relative group">
                        <span class="material-symbols-outlined absolute left-3.5 top-3.5 text-slate-400 group-focus-within:text-brand-600 text-[18px] transition-colors">person</span>
                        <input type="text" id="namaLengkap" required minlength="3" placeholder="Ahmad Dahlan" class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl py-3 pl-10 pr-3.5 text-xs font-medium text-slate-900 focus:outline-none focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-500/15 transition-all" />
                    </div>
                </div>
                <div>
                    <label class="block font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">NIK KTP * (16 Digit)</label>
                    <div class="relative group">
                        <span class="material-symbols-outlined absolute left-3.5 top-3.5 text-slate-400 group-focus-within:text-brand-600 text-[18px] transition-colors">badge</span>
                        <input type="text" id="nik" required minlength="16" maxlength="16" oninput="this.value = this.value.replace(/[^0-9]/g, '')" placeholder="3171010101900001" class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl py-3 pl-10 pr-3.5 text-xs font-medium text-slate-900 focus:outline-none focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-500/15 transition-all" />
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                <div>
                    <label class="block font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">Email *</label>
                    <div class="relative group">
                        <span class="material-symbols-outlined absolute left-3.5 top-3.5 text-slate-400 group-focus-within:text-brand-600 text-[18px] transition-colors">mail</span>
                        <input type="email" id="email" required placeholder="pasien@gmail.com" class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl py-3 pl-10 pr-3.5 text-xs font-medium text-slate-900 focus:outline-none focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-500/15 transition-all" />
                    </div>
                </div>
                <div>
                    <label class="block font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">No. Telepon * (Angka)</label>
                    <div class="relative group">
                        <span class="material-symbols-outlined absolute left-3.5 top-3.5 text-slate-400 group-focus-within:text-brand-600 text-[18px] transition-colors">call</span>
                        <input type="tel" id="noTelepon" required maxlength="14" oninput="this.value = this.value.replace(/[^0-9]/g, '')" placeholder="082100010001" class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl py-3 pl-10 pr-3.5 text-xs font-medium text-slate-900 focus:outline-none focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-500/15 transition-all" />
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                <div>
                    <label class="block font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">Password * (Min 8)</label>
                    <div class="relative group">
                        <span class="material-symbols-outlined absolute left-3.5 top-3.5 text-slate-400 group-focus-within:text-brand-600 text-[18px] transition-colors">lock</span>
                        <input type="password" id="password" required minlength="8" placeholder="••••••••" class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl py-3 pl-10 pr-3.5 text-xs font-medium text-slate-900 focus:outline-none focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-500/15 transition-all" />
                    </div>
                </div>
                <div>
                    <label class="block font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">Konfirmasi Password *</label>
                    <div class="relative group">
                        <span class="material-symbols-outlined absolute left-3.5 top-3.5 text-slate-400 group-focus-within:text-brand-600 text-[18px] transition-colors">lock_reset</span>
                        <input type="password" id="passwordConfirmation" required minlength="8" placeholder="••••••••" class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl py-3 pl-10 pr-3.5 text-xs font-medium text-slate-900 focus:outline-none focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-500/15 transition-all" />
                    </div>
                </div>
            </div>

            <div class="text-xs">
                <label class="block font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">Alamat Lengkap Pasien</label>
                <div class="relative group">
                    <span class="material-symbols-outlined absolute left-3.5 top-3.5 text-slate-400 group-focus-within:text-brand-600 text-[18px] transition-colors">home</span>
                    <input type="text" id="alamat" placeholder="Jl. Sudirman No. 12, Jakarta Pusat" class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl py-3 pl-10 pr-3.5 text-xs font-medium text-slate-900 focus:outline-none focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-500/15 transition-all" />
                </div>
            </div>

            <button type="submit" id="btn-submit" class="w-full py-4 mt-2 bg-gradient-to-r from-brand-600 via-brand-700 to-emerald-800 hover:from-brand-500 hover:to-emerald-700 text-white font-extrabold text-xs rounded-2xl shadow-xl shadow-brand-600/25 hover:shadow-brand-600/40 active:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-2 tracking-wide uppercase">
                <span>Daftar Akun Pasien Baru</span>
                <span class="material-symbols-outlined text-[18px]">check_circle</span>
            </button>
        </form>

        <div class="text-center text-xs text-slate-500 pt-3 border-t border-slate-100 flex items-center justify-between">
            <span>Sudah memiliki akun?</span>
            <a href="/frontend/html/auth/login.html" class="text-brand-600 hover:text-brand-700 font-extrabold transition-colors underline decoration-brand-300 underline-offset-4">Masuk di sini</a>
        </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/toast.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nik = document.getElementById('nik').value.trim();
            const noTelp = document.getElementById('noTelepon').value.trim();
            const p1 = document.getElementById('password').value;
            const p2 = document.getElementById('passwordConfirmation').value;

            if (nik.length !== 16 || !/^\d{16}$/.test(nik)) {
                Toast.error('NIK (KTP) wajib berupa angka persis 16 digit!', 'Validasi Gagal');
                return;
            }

            if (noTelp.length < 10 || !/^\d+$/.test(noTelp)) {
                Toast.error('Nomor Telepon wajib berupa angka (min 10 digit)!', 'Validasi Gagal');
                return;
            }

            if (p1 !== p2) {
                Toast.error('Konfirmasi password tidak cocok dengan password yang diisi!', 'Validasi Gagal');
                return;
            }

            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerHTML = `<span class="inline-block animate-spin font-bold">↻</span> <span>Mendaftarkan Akun...</span>`;

            try {
                const body = {
                    namaLengkap: document.getElementById('namaLengkap').value.trim(),
                    nik: nik,
                    email: document.getElementById('email').value.trim(),
                    noTelepon: noTelp,
                    password: p1,
                    passwordConfirmation: p2,
                    alamat: document.getElementById('alamat').value.trim(),
                    role: 'PASIEN'
                };

                const res = await API.post('/auth/register', body);
                
                // Save pasien profile to clinic service
                try {
                    await API.post('/clinic/pasien', {
                        userId: res.user?.id || 1,
                        nik: body.nik,
                        namaLengkap: body.namaLengkap,
                        email: body.email,
                        noTelepon: body.noTelepon,
                        alamat: body.alamat
                    });
                } catch(e) {}

                Toast.success('Pendaftaran Berhasil! Silakan Login menggunakan Akun Baru Anda.', 'Registrasi Sukses');
                setTimeout(() => {
                    window.location.href = '/frontend/html/auth/login.html';
                }, 1500);
            } catch (err) {
                Toast.error(err.message || 'Pendaftaran gagal.', 'Error');
                btn.disabled = false;
                btn.innerHTML = `<span>Daftar Akun Pasien Baru</span><span class="material-symbols-outlined text-[16px]">check_circle</span>`;
            }
        });
    </script>
</body>
</html>
