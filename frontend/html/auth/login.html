<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Sentra Farma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ECFDF5', 100: '#D1FAE5', 200: '#A7F3D0', 300: '#6EE7B7',
                            400: '#34D399', 500: '#10B981', 600: '#059669', 700: '#047857',
                            800: '#065F46', 900: '#064E3B', 950: '#022C22'
                        },
                        surface: '#F8FAFC'
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined,
        .material-icons,
        .material-icons-outlined {
            font-family: 'Material Symbols Outlined', 'Material Icons Outlined', 'Material Icons' !important;
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        .mesh-bg {
            background-color: #F8FAFC;
            background-image:
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(5, 150, 105, 0.1) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(16, 185, 129, 0.14) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 78, 59, 0.08) 0px, transparent 50%);
        }

        @keyframes smoothFadeUp {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-up {
            animation: smoothFadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .stagger-item {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1), transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .unfolded .stagger-1 {
            transition-delay: 0.08s;
            opacity: 1;
            transform: translateY(0);
        }

        .unfolded .stagger-2 {
            transition-delay: 0.18s;
            opacity: 1;
            transform: translateY(0);
        }

        .unfolded .stagger-3 {
            transition-delay: 0.28s;
            opacity: 1;
            transform: translateY(0);
        }

        .unfolded .stagger-4 {
            transition-delay: 0.38s;
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body
    class="mesh-bg font-sans text-slate-800 min-h-screen flex items-center justify-center p-4 md:p-8 antialiased relative overflow-hidden selection:bg-brand-100 selection:text-brand-800">

    <!-- BACKGROUND ELEGANT AMBIENT GLOW -->
    <div
        class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-brand-400/20 rounded-full blur-[140px] pointer-events-none">
    </div>
    <div
        class="absolute bottom-1/4 right-1/4 w-[500px] h-[500px] bg-teal-400/20 rounded-full blur-[140px] pointer-events-none">
    </div>

    <!-- UNIFIED HERO LOGIN CARD WITH MORPHING SPLASH ANIMATION -->
    <div id="hero-card"
        class="max-w-md w-full bg-white/95 backdrop-blur-2xl border border-emerald-100/90 shadow-[0_25px_70px_-15px_rgba(16,185,129,0.2)] p-8 md:p-10 rounded-[2.5rem] relative z-10 space-y-6 transition-all duration-700 ease-out">

        <!-- PROMINENT LARGE CENTRED LOGO (SHARED) -->
        <div class="text-center space-y-3">
            <div class="inline-block relative">
                <img src="../../assets/logo.png" alt="Sentra Farma Logo"
                    class="h-24 md:h-28 w-auto object-contain mx-auto relative z-10 drop-shadow-md transition-transform hover:scale-105 duration-300" />
            </div>
            <div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Portal Akses Sentra Farma</h1>
                <p class="text-xs font-medium text-slate-500 mt-1">Sistem Informasi Klinik & Apotek Terintegrasi</p>
            </div>
        </div>

        <!-- EKG HEARTBEAT SPLASH LOADER -->
        <div id="splash-loader" class="space-y-3 pt-2 pb-1 transition-all duration-500 ease-in-out">
            <!-- EKG MONITOR DISPLAY BOX -->
            <div
                class="relative w-full h-20 bg-slate-950 rounded-2xl border border-emerald-500/30 overflow-hidden shadow-[inset_0_2px_10px_rgba(0,0,0,0.8),0_0_15px_rgba(16,185,129,0.15)] flex flex-col justify-between p-2.5">
                <!-- EKG Grid Lines Background -->
                <div
                    class="absolute inset-0 opacity-20 bg-[linear-gradient(to_right,#10b981_1px,transparent_1px),linear-gradient(to_bottom,#10b981_1px,transparent_1px)] bg-[size:10px_10px] pointer-events-none">
                </div>

                <!-- Monitor Header / Status Bar -->
                <div
                    class="relative z-10 flex items-center justify-between px-1 text-[10px] text-emerald-400/90 font-mono tracking-wider">
                    <div class="flex items-center gap-1.5">
                        <span class="relative flex h-2 w-2">
                            <span
                                class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                        </span>
                        <span class="font-bold text-emerald-400">EKG MONITOR</span>
                    </div>
                    <div class="flex items-center gap-1.5 font-bold">
                        <span id="splash-bpm" class="text-emerald-300">75 BPM</span>
                        <span class="text-slate-600">|</span>
                        <span id="splash-percent" class="text-emerald-400 font-extrabold text-xs">0%</span>
                    </div>
                </div>

                <!-- SVG EKG Waveform Path -->
                <div class="relative w-full h-11 my-auto">
                    <svg class="w-full h-full" viewBox="0 0 500 80" preserveAspectRatio="none">
                        <!-- Background Dim Path -->
                        <path
                            d="M 0 45 L 30 45 Q 40 35 50 45 L 65 45 L 70 52 L 78 8 L 86 68 L 92 45 L 115 45 Q 130 25 145 45 L 180 45 Q 190 35 200 45 L 215 45 L 220 52 L 228 8 L 236 68 L 242 45 L 265 45 Q 280 25 295 45 L 330 45 Q 340 35 350 45 L 365 45 L 370 52 L 378 8 L 386 68 L 392 45 L 415 45 Q 430 25 445 45 L 500 45"
                            fill="none" stroke="rgba(16, 185, 129, 0.15)" stroke-width="2.5" stroke-linecap="round"
                            stroke-linejoin="round" />

                        <!-- Glowing Neon Active Path -->
                        <path id="ekg-wave-path"
                            d="M 0 45 L 30 45 Q 40 35 50 45 L 65 45 L 70 52 L 78 8 L 86 68 L 92 45 L 115 45 Q 130 25 145 45 L 180 45 Q 190 35 200 45 L 215 45 L 220 52 L 228 8 L 236 68 L 242 45 L 265 45 Q 280 25 295 45 L 330 45 Q 340 35 350 45 L 365 45 L 370 52 L 378 8 L 386 68 L 392 45 L 415 45 Q 430 25 445 45 L 500 45"
                            fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                            style="filter: drop-shadow(0px 0px 6px #10B981);" />

                        <!-- Glowing Pulse Head Dot -->
                        <circle id="ekg-head-dot" cx="0" cy="45" r="4" fill="#6EE7B7"
                            style="filter: drop-shadow(0px 0px 8px #34D399);" />
                    </svg>
                </div>
            </div>

            <!-- EKG Status Message -->
            <div id="splash-status" class="text-[11px] tracking-wide flex items-center justify-between px-1 h-5">
                <span id="splash-text" class="font-semibold text-slate-600 flex items-center gap-1.5">
                    <span
                        class="material-symbols-outlined text-[15px] text-emerald-500 animate-pulse">monitor_heart</span>
                    <span>Menghubungkan Monitor Klinik...</span>
                </span>
                <span id="splash-badge"
                    class="text-[10px] font-mono font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200/60">TERHUBUNG</span>
            </div>
        </div>

        <!-- LOGIN FORM & TABS CONTENT (UNFOLDS AFTER LOADING COMPLETES) -->
        <div id="login-content"
            class="space-y-6 max-h-0 opacity-0 overflow-hidden pointer-events-none transition-all duration-700 ease-out scale-95">
            <!-- INTERACTIVE ROLE SELECTOR TABS -->
            <div class="stagger-item stagger-1 bg-slate-100/80 p-1.5 rounded-2xl border border-slate-200/60 space-y-1">
                <div class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider text-center pt-1 pb-1.5">
                    Pilih Peran Untuk Login Cepat (Password: <code
                        class="text-brand-600 font-mono font-bold">password123</code>)</div>
                <div class="grid grid-cols-5 gap-1 text-[11px] font-bold">
                    <button type="button" onclick="selectRoleTab('pasien', 'pasien1@gmail.com')" id="tab-pasien"
                        class="role-tab active-tab py-2 px-1 rounded-xl flex flex-col items-center gap-1 transition-all bg-white text-brand-700 shadow-sm border border-brand-200 font-extrabold">
                        <span class="material-symbols-outlined text-[18px]">person</span>
                        <span class="text-[9px]">Pasien</span>
                    </button>
                    <button type="button" onclick="selectRoleTab('dokter', 'dr.arisandy@sentrafarma.com')"
                        id="tab-dokter"
                        class="role-tab py-2 px-1 rounded-xl flex flex-col items-center gap-1 transition-all text-slate-500 hover:text-slate-900 hover:bg-white/50">
                        <span class="material-symbols-outlined text-[18px]">stethoscope</span>
                        <span class="text-[9px]">Dokter</span>
                    </button>
                    <button type="button" onclick="selectRoleTab('apoteker', 'apoteker@sentrafarma.com')"
                        id="tab-apoteker"
                        class="role-tab py-2 px-1 rounded-xl flex flex-col items-center gap-1 transition-all text-slate-500 hover:text-slate-900 hover:bg-white/50">
                        <span class="material-symbols-outlined text-[18px]">medication</span>
                        <span class="text-[9px]">Apotek</span>
                    </button>
                    <button type="button" onclick="selectRoleTab('resepsionis', 'resepsionis@sentrafarma.com')"
                        id="tab-resepsionis"
                        class="role-tab py-2 px-1 rounded-xl flex flex-col items-center gap-1 transition-all text-slate-500 hover:text-slate-900 hover:bg-white/50">
                        <span class="material-symbols-outlined text-[18px]">support_agent</span>
                        <span class="text-[9px]">Loket</span>
                    </button>
                    <button type="button" onclick="selectRoleTab('admin', 'admin@sentrafarma.com')" id="tab-admin"
                        class="role-tab py-2 px-1 rounded-xl flex flex-col items-center gap-1 transition-all text-slate-500 hover:text-slate-900 hover:bg-white/50">
                        <span class="material-symbols-outlined text-[18px]">admin_panel_settings</span>
                        <span class="text-[9px]">Admin</span>
                    </button>
                </div>
            </div>

            <!-- FORM LOGIN -->
            <form id="login-form" class="space-y-4">
                <div class="stagger-item stagger-2">
                    <label class="block text-[11px] font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">EMAIL
                        ALAMAT</label>
                    <div class="relative group">
                        <span
                            class="material-symbols-outlined absolute left-4 top-3.5 text-slate-400 group-focus-within:text-brand-600 text-[20px] transition-colors">mail</span>
                        <input type="email" id="email" required placeholder="pasien1@gmail.com"
                            value="pasien1@gmail.com"
                            class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl py-3 pl-11 pr-4 text-xs font-medium text-slate-900 placeholder-slate-400 focus:outline-none focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-500/15 transition-all" />
                    </div>
                </div>

                <div class="stagger-item stagger-3">
                    <div class="flex justify-between items-center mb-1.5">
                        <label
                            class="text-[11px] font-extrabold text-slate-700 uppercase tracking-wider">PASSWORD</label>
                        <a href="/frontend/html/auth/forgot-password.html"
                            class="text-xs text-brand-600 hover:text-brand-700 font-bold transition-colors">Lupa
                            Password?</a>
                    </div>
                    <div class="relative group">
                        <span
                            class="material-symbols-outlined absolute left-4 top-3.5 text-slate-400 group-focus-within:text-brand-600 text-[20px] transition-colors">lock</span>
                        <input type="password" id="password" required placeholder="••••••••" value="password123"
                            class="w-full bg-slate-50/80 border border-slate-200 rounded-2xl py-3 pl-11 pr-11 text-xs font-medium text-slate-900 placeholder-slate-400 focus:outline-none focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-500/15 transition-all" />
                        <button type="button" onclick="togglePasswordVisibility()"
                            class="absolute right-3.5 top-3 text-slate-400 hover:text-slate-700 focus:outline-none p-1">
                            <span id="eye-icon" class="material-symbols-outlined text-[20px]">visibility</span>
                        </button>
                    </div>
                </div>

                <div class="stagger-item stagger-4">
                    <button type="submit" id="btn-submit"
                        class="w-full py-4 bg-gradient-to-r from-brand-600 via-brand-700 to-emerald-800 hover:from-brand-500 hover:to-emerald-700 text-white font-extrabold text-xs rounded-2xl shadow-xl shadow-brand-600/25 hover:shadow-brand-600/40 active:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-2 tracking-wide uppercase">
                        <span>Masuk Sekarang</span>
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                    </button>
                </div>
            </form>

            <div
                class="text-center text-xs text-slate-500 pt-2 border-t border-slate-100 flex items-center justify-between">
                <span>Belum memiliki akun?</span>
                <a href="/frontend/html/auth/register.html"
                    class="text-brand-600 hover:text-brand-700 font-extrabold transition-colors underline decoration-brand-300 underline-offset-4">Daftar
                    Pasien Baru</a>
            </div>
        </div>

    </div>

    <script src="../../js/auth-guard.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/toast.js"></script>
    <script>
        // APP OPENING SPLASH ANIMATION (MORPHING CARD - RUNS ONCE PER SESSION)
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.getElementById('hero-card');
            const loader = document.getElementById('splash-loader');
            const progress = document.getElementById('splash-progress');
            const stageText = document.getElementById('splash-text');
            const percentText = document.getElementById('splash-percent');
            const bpmText = document.getElementById('splash-bpm');
            const badgeText = document.getElementById('splash-badge');
            const loginContent = document.getElementById('login-content');
            const ekgPath = document.getElementById('ekg-wave-path');
            const ekgHead = document.getElementById('ekg-head-dot');

            if (!loader || !loginContent) return;

            let totalLen = 0;
            if (ekgPath) {
                totalLen = ekgPath.getTotalLength();
                ekgPath.style.strokeDasharray = totalLen;
                ekgPath.style.strokeDashoffset = totalLen;
            }

            let p = 1;

            const interval = setInterval(() => {
                p += 1;
                if (p > 100) p = 100;
                if (percentText) percentText.textContent = p + '%';

                if (ekgPath && totalLen > 0) {
                    const currentLen = (p / 100) * totalLen;
                    ekgPath.style.strokeDashoffset = totalLen - currentLen;
                    if (ekgHead) {
                        try {
                            const pt = ekgPath.getPointAtLength(currentLen);
                            ekgHead.setAttribute('cx', pt.x);
                            ekgHead.setAttribute('cy', pt.y);
                        } catch (err) { }
                    }
                }

                if (stageText) {
                    if (p <= 35) {
                        stageText.innerHTML = `<span class="material-symbols-outlined text-[15px] text-emerald-500 animate-pulse">monitor_heart</span><span>Menghubungkan Monitor Klinik...</span>`;
                        if (bpmText) bpmText.textContent = `${70 + Math.floor(Math.random() * 4)} BPM`;
                    } else if (p <= 75) {
                        stageText.innerHTML = `<span class="material-symbols-outlined text-[15px] text-teal-500 animate-pulse">ecg_heart</span><span>Memuat Data Dokter & Apotek 24 Jam...</span>`;
                        if (bpmText) bpmText.textContent = `${75 + Math.floor(Math.random() * 5)} BPM`;
                        if (badgeText) {
                            badgeText.textContent = 'STABIL';
                            badgeText.className = 'text-[10px] font-mono font-bold text-teal-700 bg-teal-50 px-2 py-0.5 rounded-full border border-teal-200/60';
                        }
                    } else if (p < 100) {
                        stageText.innerHTML = `<span class="material-symbols-outlined text-[15px] text-emerald-600 animate-pulse">vital_signs</span><span>Menyiapkan Akses Safe Session...</span>`;
                        if (bpmText) bpmText.textContent = `${78 + Math.floor(Math.random() * 3)} BPM`;
                    } else {
                        stageText.innerHTML = `<span class="material-symbols-outlined text-[15px] text-emerald-600">check_circle</span><span>Sistem Siap Digunakan!</span>`;
                        if (bpmText) bpmText.textContent = `75 BPM OK`;
                        if (badgeText) {
                            badgeText.textContent = 'SIAP';
                            badgeText.className = 'text-[10px] font-mono font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full border border-emerald-300';
                        }
                    }
                }

                if (p >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        if (card) {
                            card.classList.remove('max-w-md');
                            card.classList.add('max-w-lg');
                        }

                        loader.style.maxHeight = '0px';
                        loader.style.opacity = '0';
                        loader.style.overflow = 'hidden';

                        loginContent.classList.remove('max-h-0', 'opacity-0', 'pointer-events-none', 'scale-95');
                        loginContent.classList.add('max-h-[1000px]', 'opacity-100', 'scale-100', 'pointer-events-auto', 'unfolded');

                        setTimeout(() => {
                            loader.classList.add('hidden');
                        }, 500);
                    }, 200);
                }
            }, 45);
        });

        function selectRoleTab(role, email) {
            document.querySelectorAll('.role-tab').forEach(tab => {
                tab.className = "role-tab py-2 px-1 rounded-xl flex flex-col items-center gap-1 transition-all text-slate-500 hover:text-slate-900 hover:bg-white/50";
            });
            const activeTab = document.getElementById(`tab-${role}`);
            if (activeTab) {
                activeTab.className = "role-tab active-tab py-2 px-1 rounded-xl flex flex-col items-center gap-1 transition-all bg-white text-brand-700 shadow-sm border border-brand-200 font-extrabold";
            }
            document.getElementById('email').value = email;
            document.getElementById('password').value = 'password123';
        }

        function togglePasswordVisibility() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin h-4 w-4 text-white inline-block mr-1" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> <span>Memproses...</span>`;

            try {
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                const res = await API.post('/auth/login', { email, password });
                API.setSession(res.token, res.user);

                Toast.success(`Selamat datang kembali, ${res.user.namaLengkap}!`, 'Login Berhasil');

                setTimeout(() => {
                    switch (res.user.role) {
                        case 'DOKTER': window.location.href = '/frontend/html/dokter/dashboard.html'; break;
                        case 'APOTEKER': window.location.href = '/frontend/html/apoteker/dashboard.html'; break;
                        case 'RESEPSIONIS': window.location.href = '/frontend/html/resepsionis/dashboard.html'; break;
                        case 'ADMIN': window.location.href = '/frontend/html/admin/dashboard.html'; break;
                        case 'PASIEN':
                        default: window.location.href = '/frontend/html/user/dashboard.html'; break;
                    }
                }, 1000);
            } catch (err) {
                Toast.error(err.message || 'Login gagal, periksa email & password Anda.', 'Gagal Login');
                btn.disabled = false;
                btn.innerHTML = `<span>Masuk Sekarang</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>`;
            }
        });
    </script>
</body>

</html>
