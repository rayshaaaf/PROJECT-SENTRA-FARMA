<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>500 - Internal Server Error | Sentra Farma</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 font-sans text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full text-center space-y-6">
        <div class="w-24 h-24 rounded-3xl bg-purple-500/10 border border-purple-500/20 text-purple-400 flex items-center justify-center mx-auto">
            <span class="material-symbols-outlined text-[48px]">dns</span>
        </div>
        <h1 class="text-6xl font-black text-white tracking-wider">500</h1>
        <h2 class="text-xl font-bold text-slate-200">Terjadi Kesalahan Server</h2>
        <p class="text-slate-400 text-sm">Layanan backend mengalami gangguan sementara. Silakan coba beberapa saat lagi.</p>
        <button onclick="window.location.reload()" class="inline-flex items-center gap-2 px-6 py-3 bg-purple-600 hover:bg-purple-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-purple-600/30">
            <span class="material-symbols-outlined text-[20px]">refresh</span>
            <span>Muat Ulang Halaman</span>
        </button>
    </div>
</body>
</html>
