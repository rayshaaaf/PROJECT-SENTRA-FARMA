<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>403 - Forbidden | Sentra Farma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .material-symbols-outlined, .material-icons, .material-icons-outlined {
            font-family: 'Material Symbols Outlined', 'Material Icons Outlined', 'Material Icons' !important;
            font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; letter-spacing: normal;
            text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr;
            -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="bg-slate-900 font-sans text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full text-center space-y-6">
        <div class="w-24 h-24 rounded-3xl bg-rose-500/10 border border-rose-500/20 text-rose-400 flex items-center justify-center mx-auto">
            <span class="material-symbols-outlined text-[48px]">block</span>
        </div>
        <h1 class="text-6xl font-black text-white tracking-wider">403</h1>
        <h2 class="text-xl font-bold text-slate-200">Akses Ditolak (Forbidden)</h2>
        <p class="text-slate-400 text-sm">Role akun Anda tidak memiliki izin untuk mengakses halaman ini.</p>
        <button onclick="window.history.back()" class="inline-flex items-center gap-2 px-6 py-3 bg-slate-800 border border-slate-700 hover:bg-slate-700 text-white font-semibold rounded-xl transition-all">
            <span class="material-symbols-outlined text-[20px]">arrow_back</span>
            <span>Kembali ke Halaman Sebelumnya</span>
        </button>
    </div>
</body>
</html>
