<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>403 - Forbidden | Sentra Farma</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 font-sans text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full text-center space-y-6">
        <div class="w-24 h-24 rounded-3xl bg-rose-500/10 border border-rose-500/20 text-rose-400 flex items-center justify-center mx-auto">
            <span class="material-symbols-outlined text-[48px]">block</span>
        </div>
        <h1 class="text-6xl font-black text-white tracking-wider">403</h1>
        <h2 class="text-xl font-bold text-slate-200">Akses Ditolak (Forbidden)</h2>
        <p class="text-slate-400 text-sm">Role akun Anda tidak memiliki izin untuk mengakses halaman ini.</p>
        <button onclick="window.history.back()" class="inline-flex items-center gap-2 px-6 py-3 bg-slate-800 border border-slate-700 hover:bg-slate-700 text-white font-semibold rounded-xl transition-all">
            <span class="material-symbols-outlined text-[20px]">arrow_back</span>
            <span>Kembali ke Halaman Sebelumnya</span>
        </button>
    </div>
</body>
</html>
